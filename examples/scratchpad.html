<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8" />
    <meta name="description" content="An Online IDE for the Coq Theorem Prover" />
    <link rel="icon" href="../frontend/classic/images/favicon.png">

    <title>jsCoq – The Coq Theorem Prover Online IDE</title>
    <link rel="stylesheet" type="text/css" href="../dist/frontend/index.css">
  </head>

<body class="jscoq-main">
  <div style="display: flex; flex-direction: row;">
    <div id="documents" style="display: flex; flex-direction: column; position: relative;">
      <!-- documents list -->
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; max-width: 100%; max-height: 100%;">
      <div id="gist-root">
        <!-- input & buttons for gist -->
      </div>
      <div id="tabs" style="display: flex; flex-direction: row; overflow-x: auto;">
        <!-- opened tabs list -->
      </div>
      <div id="ide-wrapper" class="toggled" data-filename="scratchpad.v" style="width: 100%;">
        <!-- Editor and panel are created here by CoqManager -->
        <div id="editors">
          <!-- editors created by CoqEditor -->
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { JsCoq } from "../jscoq.js";

    var sp = new URLSearchParams(location.search),
        ifHas = x => sp.has(x) ? x : undefined,
        panel_theme = ifHas('dark') ?? sp.get('theme') ?? 'light',
        editor_theme = sp.get('editor_theme') ?? (panel_theme == 'dark' ? 'blackboard' : 'default');

    var jscoq_opts = {
        backend: sp.get('backend') ?? ifHas('wa'),
        frontend: sp.get('frontend'),
        subproc: sp.has('app'),
        languageId: sp.get('languageId'),
        node_modules_path: '../node_modules/',
        file_dialog: true,
        implicit_libs: true,
        init_pkgs: ['init', 'coq-base', 'coq-collections', 'coq-arith'],
        all_pkgs:  ['coq'],
        multiple_editors: true, // ***TODO remove after layout is fixed
        editor: { mode: { 'company-coq': false }, theme: editor_theme },
        theme: panel_theme
    };

    /* Global reference */
    var coq;

    JsCoq.start(jscoq_opts).then(res => {
      coq = res;
      window.coq = coq;
      if (sp.has('project'))     coq.openProject(sp.get('project'));
      if (sp.has('p2p'))         coq.openCollab({p2p: sp.get('p2p')});
      if (sp.has('gist'))        coq.openCollab({gist: sp.get('gist')});
      // if (sp.has('code'))
    });
    window.addEventListener("beforeunload", async (ev) => {
      ev.preventDefault();
      await coq.saveCurrentDocumentInCache();
    });
  </script>
</body>
</html>
